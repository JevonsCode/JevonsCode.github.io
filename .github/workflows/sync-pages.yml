name: Sync GitHub Pages Portal Manifest

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync live GitHub Pages catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-pages.mjs

      - name: Commit updated manifest if changed
        run: |
          if git diff --quiet -- portal/data/pages-manifest.json; then
            echo "No Pages catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/data/pages-manifest.json
          git commit -m "chore(portal): sync live GitHub Pages manifest"
          git push
